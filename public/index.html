<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معجنات الريان</title>
    <style>
        :root {
            --bg: #070707;
            --panel-1: #1a1a1a;
            --panel-2: #262626;
            --border: #333333;
            --input-border: #444444;
            --text: #ffffff;
            --muted: #a9a9a9;
            --gold: #d4af37;
            --gold-hover: #e6c65c;
            --danger: #ff3c3c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Tahoma, "Segoe UI", sans-serif;
            line-height: 1.5;
            min-height: 100vh;
        }
        .screen-center {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: var(--panel-1);
            border: 1px solid var(--border);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
            text-align: center;
        }
        h2 { margin-bottom: 25px; color: var(--text); }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            background: var(--panel-2);
            border: 1px solid var(--input-border);
            color: var(--text);
            border-radius: 4px;
            font-size: 16px;
        }
        input:focus { outline: 1px solid var(--gold); }
        button {
            width: 100%;
            padding: 12px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: var(--gold-hover); }
        .error-message { color: var(--danger); margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

    <section class="screen-center">
        <div class="auth-card">
            <h2>تسجيل الدخول / الإدارة</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit">دخول</button>
                <div id="message" class="error-message"></div>
            </form>
        </div>
    </section>

    <script>
        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            if (email && password) {
                // يمكنك ربط عملية التحقق الفعلية هنا لاحقاً
                alert("تم تسجيل الدخول بنجاح!");
                messageDiv.style.display = 'none';
            } else {
                messageDiv.textContent = "يرجى تعبئة الحقول المطلوبة.";
                messageDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
