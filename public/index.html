<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معجنات الريان</title>
  <style>
    :root {
      --bg: #070707;
      --panel: #111111;
      --panel-2: #080808;
      --border: #292929;
      --input-border: #444444;
      --text: #f7f7f7;
      --muted: #9a9a9a;
      --gold: #d4ad55;
      --gold-hover: #e2bd6c;
      --danger: #ff5c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, "Segoe UI", sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; margin-bottom: 16px; }
    h2 { color: var(--gold); margin: 16px 0; }
    header.topbar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--panel); border-bottom: 1px solid #282828; padding: 16px 24px;
    }
    header.topbar h1 { margin: 0; font-size: 20px; color: var(--gold); }
    main { max-width: 1100px; margin: 24px auto; padding: 0 20px 48px; }
    .screen-center {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 40px 20px;
    }
    .screen-center h1 { font-size: 40px; color: var(--gold); margin: 0; font-weight: 900; }
    .divider { width: 80px; height: 3px; background: var(--gold); margin: 20px auto; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 15px; padding: 24px; width: 100%; max-width: 420px;
    }
    .card input {
      width: 100%; padding: 12px; margin-bottom: 12px; background: var(--panel-2);
      border: 1px solid var(--input-border); color: var(--text); border-radius: 8px;
      font-family: inherit; font-size: 15px;
    }
    .card input:focus { outline: none; border-color: var(--gold); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 10px; background: transparent; color: var(--muted);
      border: 1px solid var(--input-border); border-radius: 8px; cursor: pointer; font-family: inherit;
    }
    .tab.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
    .label { display: block; text-align: right; color: var(--muted); font-size: 14px; margin-bottom: 6px; }
    .btn {
      background: #1f1f1f; color: var(--text); border: 1px solid var(--input-border);
      padding: 10px 16px; border-radius: 8px; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: var(--gold); }
    .btn.gold { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }
    .btn.gold:hover { background: var(--gold-hover); }
    .btn.block { width: 100%; }
    .message { color: var(--danger); min-height: 22px; margin: 12px 0 0; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 24px; }
    .menu {
      background: var(--panel); border: 1px solid var(--border); border-radius: 15px;
      padding: 28px 20px; color: var(--text); text-align: center; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, transform 0.2s;
    }
    .menu:hover { border-color: var(--gold); transform: translateY(-2px); }
    .menu .icon { font-size: 40px; margin-bottom: 10px; }
    .menu h3 { margin: 0 0 8px; font-size: 17px; }
    .tablebox {
      background: var(--panel); border: 1px solid var(--border); border-radius: 15px;
      overflow-x: auto; margin-top: 16px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #1d1d1d; white-space: nowrap; }
    th { color: var(--gold); font-weight: bold; background: #0c0c0c; }
    .statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
    .stat {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 20px; text-align: center; color: var(--muted);
    }
    .stat b { display: block; font-size: 24px; color: var(--gold); margin-top: 8px; }
    @media (max-width: 600px) {
      header.topbar { padding: 12px 16px; }
      .screen-center h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <section id="splash" class="screen-center">
    <h1>معجنات الريان</h1>
    <div class="divider"></div>
    <p class="muted">نظام الإدارة</p>
    <button id="goAuth" class="btn gold">ابدأ</button>
  </section>

  <section id="auth" class="screen-center hidden">
    <h1>معجنات الريان</h1>
    <div class="divider"></div>
    <p class="muted">نظام الإدارة - يرجى تسجيل الدخول</p>
    <div class="card">
      <div class="tabs">
        <button id="loginTab" class="tab active">تسجيل الدخول</button>
        <button id="signupTab" class="tab">حساب جديد</button>
      </div>
      <div id="activationWrap" class="hidden">
        <label class="label" for="activation">كود التفعيل</label>
        <input id="activation" type="password" autocomplete="off" />
      </div>
      <label id="nameLabel" class="label hidden" for="fullName">الاسم الكامل</label>
      <input id="fullName" class="hidden" type="text" autocomplete="name" />
      <label class="label" for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" />
      <label class="label" for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="authButton" class="btn gold block">دخول</button>
      <p id="message" class="message"></p>
    </div>
  </section>

  <div id="appScreen" class="hidden">
    <header class="topbar">
      <div>
        <h1>معجنات الريان</h1>
        <small id="who" class="muted"></small>
      </div>
      <button id="logout" class="btn">تسجيل الخروج</button>
    </header>
    <main>
      <div id="content"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
